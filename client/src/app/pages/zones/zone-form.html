<div class="p-4" style="max-width: 600px;">
  <h2 class="mb-4">{{ isEdit ? 'Editar zona' : 'Nueva zona de intervención' }}</h2>

  @if (loading) {
    <div class="text-center py-5">
      <div class="spinner-border text-success" role="status"></div>
    </div>
  } @else {
    @if (error) {
      <div class="alert alert-danger">{{ error }}</div>
    }

    <form (ngSubmit)="submit()">
      <div class="mb-3">
        <label for="name" class="form-label">Nombre de la zona *</label>
        <input id="name" type="text" class="form-control" [(ngModel)]="form.name" name="name" required maxlength="255">
      </div>

      <div class="mb-3">
        <label for="description" class="form-label">Descripción</label>
        <textarea id="description" class="form-control" [(ngModel)]="form.description" name="description" rows="3" maxlength="2000"></textarea>
      </div>

      <div class="mb-3">
        <label class="form-label">Geometría</label>
        <p class="text-muted small">Integración de mapa próximamente.</p>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-success" [disabled]="saving">
          @if (saving) {
            <span class="spinner-border spinner-border-sm me-1"></span>
          }
          {{ isEdit ? 'Actualizar' : 'Crear' }}
        </button>
        <a routerLink="/zones" class="btn btn-outline-secondary">Cancelar</a>
      </div>
    </form>
  }
</div>
