<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="card shadow" style="max-width: 400px; width: 100%;">
    <div class="card-body p-4">
      <h1 class="card-title text-center mb-4 fs-3">Lloa Reforestación</h1>

      @if (error()) {
        <div class="alert alert-danger py-2">{{ error() }}</div>
      }

      <form (ngSubmit)="submit()">
        <div class="mb-3">
          <label for="email" class="form-label">Correo electrónico</label>
          <input id="email" type="email" class="form-control" [(ngModel)]="email" name="email" required autocomplete="email">
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input id="password" type="password" class="form-control" [(ngModel)]="password" name="password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary w-100" [disabled]="loading()">
          @if (loading()) {
            <span class="spinner-border spinner-border-sm me-1"></span>
          }
          Iniciar sesión
        </button>
      </form>

      <p class="text-center mt-3 mb-0 text-muted small">
        ¿Eres administrador? <a routerLink="/login" class="text-decoration-none">Inicia sesión</a> para gestionar usuarios.
      </p>
    </div>
  </div>
</div>
