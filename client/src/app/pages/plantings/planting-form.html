<div class="p-4" style="max-width: 720px;">
  <h2 class="mb-4">Registrar nueva plántula</h2>

  @if (error) {
    <div class="alert alert-danger">{{ error }}</div>
  }

  <form (ngSubmit)="submit()">
    <div class="row">
      <div class="col-md-6 mb-3">
        <label for="species_id" class="form-label">Especie *</label>
        <select id="species_id" class="form-select" [(ngModel)]="form.species_id" name="species_id" required>
          <option value="0" disabled>Seleccionar especie</option>
          @for (s of speciesList; track s.id) {
            <option [value]="s.id">{{ s.common_name }} ({{ s.scientific_name }})</option>
          }
        </select>
      </div>

      <div class="col-md-6 mb-3">
        <label for="zone_id" class="form-label">Zona de intervención *</label>
        <select id="zone_id" class="form-select" [(ngModel)]="form.zone_id" name="zone_id" required>
          <option value="0" disabled>Seleccionar zona</option>
          @for (z of zonesList; track z.id) {
            <option [value]="z.id">{{ z.name }}</option>
          }
        </select>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Ubicación *</label>
      <div class="d-flex gap-2 mb-2">
        <button type="button" class="btn btn-outline-primary" (click)="captureGps()">
          Capturar GPS
        </button>
      </div>
      @if (gpsStatus) {
        <div class="small text-muted mb-2">{{ gpsStatus }}</div>
      }
      <div class="row g-2 mb-2">
        <div class="col">
          <input type="number" class="form-control form-control-sm" placeholder="Latitud" [(ngModel)]="form.lat" name="lat" step="any" (input)="updateMarkerFromCoords()">
        </div>
        <div class="col">
          <input type="number" class="form-control form-control-sm" placeholder="Longitud" [(ngModel)]="form.lng" name="lng" step="any" (input)="updateMarkerFromCoords()">
        </div>
      </div>
      <div #mapContainer style="height: 300px; border-radius: 6px;" class="border"></div>
      <div class="form-text">Haz clic en el mapa o captura tu ubicación con GPS.</div>
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label for="planted_at" class="form-label">Fecha de siembra</label>
        <input id="planted_at" type="date" class="form-control" [(ngModel)]="form.planted_at" name="planted_at">
      </div>

      <div class="col-md-3 mb-3">
        <label for="initial_ph" class="form-label">pH del suelo</label>
        <input id="initial_ph" type="number" class="form-control" [(ngModel)]="form.initial_ph" name="initial_ph" min="0" max="14" step="0.1" placeholder="0–14">
      </div>

      <div class="col-md-3 mb-3">
        <label for="initial_humidity" class="form-label">Humedad (%)</label>
        <input id="initial_humidity" type="number" class="form-control" [(ngModel)]="form.initial_humidity" name="initial_humidity" min="0" max="100" step="0.1" placeholder="0–100">
      </div>
    </div>

    <div class="mb-4">
      <label for="initial_soil_texture" class="form-label">Textura del suelo</label>
      <select id="initial_soil_texture" class="form-select" [(ngModel)]="form.initial_soil_texture" name="initial_soil_texture">
        <option value="">Sin especificar</option>
        @for (t of soilTextures; track t.value) {
          <option [value]="t.value">{{ t.label }}</option>
        }
      </select>
    </div>

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-success" [disabled]="saving || !form.species_id || !form.zone_id || !form.lat || !form.lng">
        @if (saving) {
          <span class="spinner-border spinner-border-sm me-1"></span>
        }
        Registrar plántula
      </button>
      <a routerLink="/dashboard" class="btn btn-outline-secondary">Cancelar</a>
    </div>
  </form>
</div>
