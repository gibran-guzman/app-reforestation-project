<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="card shadow" style="max-width: 400px; width: 100%;">
    <div class="card-body p-4">
      <h3 class="card-title text-center mb-1">Crear usuario</h3>
      <p class="text-muted text-center small mb-4">Solo administradores pueden crear nuevos usuarios</p>

      @if (error()) {
        <div class="alert alert-danger py-2">{{ error() }}</div>
      }
      @if (success()) {
        <div class="alert alert-success py-2">{{ success() }}</div>
      }

      <form (ngSubmit)="submit()">
        <div class="mb-3">
          <label for="full_name" class="form-label">Nombre completo</label>
          <input id="full_name" type="text" class="form-control" [(ngModel)]="full_name" name="full_name" required>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Correo electrónico</label>
          <input id="email" type="email" class="form-control" [(ngModel)]="email" name="email" required autocomplete="email">
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input id="password" type="password" class="form-control" [(ngModel)]="password" name="password" required minlength="8" autocomplete="new-password">
          <div class="form-text">Mínimo 8 caracteres</div>
        </div>

        <div class="mb-3">
          <label for="role" class="form-label">Rol</label>
          <select id="role" class="form-select" [(ngModel)]="role" name="role">
            <option value="technician">Técnico</option>
            <option value="admin">Administrador</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary w-100" [disabled]="loading()">
          @if (loading()) {
            <span class="spinner-border spinner-border-sm me-1"></span>
          }
          Crear usuario
        </button>
      </form>

      <p class="text-center mt-3 mb-0">
        <a routerLink="/dashboard" class="text-decoration-none">Volver al panel</a>
      </p>
    </div>
  </div>
</div>
