<div class="p-3 p-md-4">
  <h2 class="mb-4">Panel principal</h2>

  @if (successMsg) {
    <div class="alert alert-success alert-dismissible d-flex align-items-center gap-2 py-2 pe-4" role="alert">
      <span>✅ {{ successMsg }}</span>
      <button type="button" class="btn-close ms-auto" (click)="successMsg = ''" aria-label="Cerrar"></button>
    </div>
  }

  <div class="row g-3">
    <div class="col-md-4">
      <div class="card shadow-sm h-100">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">Especies</h5>
          <p class="card-text text-muted">Gestionar catálogo de especies</p>
          <a routerLink="/species" class="btn btn-outline-success mt-auto">Ver catálogo</a>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card shadow-sm h-100">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">Zonas</h5>
          <p class="card-text text-muted">Gestionar zonas de intervención</p>
          <a routerLink="/zones" class="btn btn-outline-success mt-auto">Ver zonas</a>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card shadow-sm h-100">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">Plantaciones</h5>
          <p class="card-text text-muted">Ver y registrar plántulas</p>
          <div class="d-flex gap-2 mt-auto">
            <a routerLink="/plantings" class="btn btn-outline-success flex-fill">Ver</a>
            <a routerLink="/plantings/new" class="btn btn-success flex-fill">Registrar</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
